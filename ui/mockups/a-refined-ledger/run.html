<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-motion="quiet">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="page-type" content="software" />
  <meta name="site-kind" content="software" />
  <meta name="page-kind" content="dashboard" />
  <meta
    name="description"
    content="Shim Desk Ledger run r-0001: the full record of a shim upgrade, from scan to gates, review, and the pull request it opened."
  />
  <title>Shim Desk Ledger · r-0001</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="board.css" />
</head>
<body>
  <div id="app"></div>
  <script src="render.js"></script>
  <script>
    (async function () {
      const root = document.getElementById("app");
      try {
        const r = await loadRun("r-0001.json");
        renderRun(r, root);
      } catch (err) {
        root.innerHTML =
          '<div class="page"><a class="back-link" href="runs.html">← All runs</a><div class="card"><strong>Can\'t read this run</strong> <span class="muted">' +
          String(err).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])) +
          "</span></div></div></div>";
      }
    })();
  </script>
</body>
</html>
