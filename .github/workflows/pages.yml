# Shim Desk — Ledger Board GitHub Pages deploy (02-UI-SPEC §8).
#
# Pages source = GitHub Actions (NOT "Deploy from a branch"). JayanthMalladi
# enables this by hand ONCE in the repo's Pages settings (Source: GitHub
# Actions) — 02 §8. Until that one-time step, this workflow builds but the
# page will not serve. `vite.config.ts` uses base './' so the static build
# works under /shim-desk/ (02 §8).
#
# Owned by WP UI-4 exclusively; no other agent touches this file.
#
# Triggers:
#   - push to main touching ui/** or ledger/** (the static build reads the
#     ledger into dist/data/, so a ledger change re-deploys the board).
#   - workflow_dispatch (manual) for ad-hoc re-deploys.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'ledger/**'
  workflow_dispatch:

# Allow the Pages deployment to act as GITHUB_PAGES_DEPLOY.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel in-flight runs when a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: npm ci --prefix ui

      - name: Build
        run: npm run build --prefix ui

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
