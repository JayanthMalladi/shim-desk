<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1B19">
  <rect width="1040" height="560" fill="#FAFAF7"/>
  <text x="24" y="30" font-size="16" font-weight="700">Shim Desk — where a breaking API upgrade gets worked out, in a room</text>

  <!-- Mattermost room -->
  <rect x="24" y="56" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#E6E4DE"/>
  <text x="40" y="80" font-weight="700" fill="#2F5D50">Mattermost room: ~shim-desk</text>
  <text x="40" y="104" fill="#6B6862">Person + two agents talk here</text>
  <text x="40" y="124">• @shim  (lead, Opus 5.5)</text>
  <text x="40" y="144">• @reviewer (Sonnet 5.5)</text>
  <text x="40" y="164">• you (the human gates)</text>

  <!-- Switch server -->
  <rect x="380" y="56" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#E6E4DE"/>
  <text x="396" y="80" font-weight="700" fill="#2F5D50">Switch (local server)</text>
  <text x="396" y="104" fill="#6B6862">rooms · roles · shared ledger</text>
  <text x="396" y="124">documents · agent sessions</text>
  <text x="396" y="144" fill="#6B6862">+ Mattermost (Docker)</text>

  <!-- lead agent -->
  <rect x="380" y="240" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#E6E4DE"/>
  <text x="396" y="264" font-weight="700">shim-lead.jayanth</text>
  <text x="396" y="284" fill="#6B6862">Claude Code · Opus 5.5 · D:\shim-desk</text>
  <text x="396" y="304">skills: shim-upgrade, desk-reporting</text>
  <text x="396" y="324">subagents: shim-fixer ×N, gate-runner</text>
  <text x="396" y="344" fill="#6B6862">(Sonnet 5.5, one per file, parallel)</text>

  <!-- reviewer agent -->
  <rect x="704" y="240" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#E6E4DE"/>
  <text x="720" y="264" font-weight="700">shim-reviewer.jayanth</text>
  <text x="720" y="284" fill="#6B6862">Claude Code · Sonnet 5.5 · read-only</text>
  <text x="720" y="304">skill: shim-review</text>
  <text x="720" y="324">posts one VERDICT line in the room</text>

  <!-- tooling -->
  <rect x="380" y="404" width="624" height="64" rx="8" fill="#FFFFFF" stroke="#E6E4DE"/>
  <text x="396" y="430" font-weight="700" fill="#2F5D50">The real tools the lead drives</text>
  <text x="396" y="452" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#6B6862">npx getshim@0.1.0 · git · gh · npm/pnpm · node scripts/*.mjs</text>

  <!-- ledger -->
  <rect x="704" y="404" width="300" height="64" rx="8" fill="#FFFFFF" stroke="#2F5D50"/>
  <text x="720" y="430" font-weight="700">ledger/r-0001.json</text>
  <text x="720" y="452" fill="#6B6862">→ the read-only ledger board</text>

  <!-- arrows -->
  <g stroke="#2F5D50" stroke-width="1.5" fill="none" marker-end="url(#a)"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#2F5D50"/></marker></defs></g>
  <line x1="324" y1="116" x2="380" y2="116" stroke="#2F5D50" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="420" y1="176" x2="420" y2="240" stroke="#2F5D50" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="660" y1="300" x2="704" y2="300" stroke="#B26B00" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="520" y1="360" x2="520" y2="404" stroke="#2F5D50" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="660" y1="300" x2="854" y2="404" stroke="#2F5D50" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="610" y="292" fill="#B26B00" font-size="11">hand-off @reviewer</text>
  <text x="690" y="372" fill="#6B6862" font-size="11">writes the ledger</text>
</svg>
